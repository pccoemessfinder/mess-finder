<div id="menuPopup" class="popup">

<script type="module">
    import {
  db,
  ref,
  get
} from "./db.js";

// ---------- Weekly Menu popup (menu and price) ----------
function parseMenuText(text){

    let title = "";
    let rows = [];

    String(text || "").split(/\r?\n/).forEach(function(raw, i){

        let line = raw.trim();
        if(!line) return;

        let m = line.match(/^(.*?)\s*[-–—:]?\s*((?:₹|Rs\.?)\s*\d[\d\s,.\-–]*)$/i);

        if(m && m[1].trim()){
            rows.push({ item: m[1].trim(), price: m[2].trim() });
            return;
        }

        // first line like "... MENU" is the title
        if(rows.length === 0 && !title && /menu\s*$/i.test(line)){
            title = line;
            return;
        }

        // short plain lines (Monday, NON-VEG) are section headings,
        // longer ones are items without a price
        if(line.length <= 25 && !/[:,]/.test(line) && !/\s[-–—]\s/.test(line)){
            rows.push({ heading: line });
        }else{
            rows.push({ item: line, price: "-" });
        }
    });

    return { title: title, rows: rows };
}

function showMenuPopup(text, opts){

    opts = opts || {};

    let parsed = parseMenuText(text);

    let title = opts.title || parsed.title || "Weekly Menu";

    let html = "";

    if(parsed.rows.length === 0){

        html += '<p style="color:white;">Menu not added yet.</p>';

    }else{

        html += `
<table style="width:100%; border-collapse:collapse; color:white; margin-top:10px;">
<thead>
<tr>
<th style="text-align:left; padding:8px; border-bottom:2px solid #38bdf8;">📋 Menu</th>
<th style="text-align:right; padding:8px; border-bottom:2px solid #38bdf8; white-space:nowrap;">💰 Price</th>
</tr>
</thead>
<tbody>`;

        parsed.rows.forEach(function(r){

            if(r.heading){
                html += `<tr><td colspan="2" style="padding:14px 8px 4px; font-weight:bold; color:#38bdf8;">${esc(r.heading)}</td></tr>`;
            }else{
                html += `<tr>
<td style="padding:8px; border-bottom:1px solid #475569;">${esc(r.item)}</td>
<td style="padding:8px; border-bottom:1px solid #475569; text-align:right; white-space:nowrap;">${esc(r.price)}</td>
</tr>`;
            }
        });

        html += "</tbody></table>";
    }

    document.getElementById("menuPopupTitle").innerText = "📋 " + title;
    document.getElementById("menuPopupBody").innerHTML = html;
    document.getElementById("menuPopup").style.display = "block";
}

function closeMenuPopup(){
    document.getElementById("menuPopup").style.display = "none";
}

function searchMess(){

    let input =
    document.getElementById("searchInput")
    .value.toLowerCase();

    let cards =
    document.querySelectorAll(".college-card");

    cards.forEach(card=>{

        let text =
        card.innerText.toLowerCase();

        if(text.includes(input)){
            card.style.display="block";
        }
        else{
            card.style.display="none";
        }

    });

}

function filterMess(type){

    let vegCards = document.querySelectorAll(".veg-card");
    let nonvegCards = document.querySelectorAll(".nonveg-card");

    if(type==="all"){
        document.querySelectorAll(".college-card").forEach(card=>{
            card.style.display="block";
        });
    }

    if(type==="veg"){
        vegCards.forEach(card=>card.style.display="block");
        nonvegCards.forEach(card=>card.style.display="none");
    }

    if(type==="nonveg"){
        vegCards.forEach(card=>card.style.display="none");
        nonvegCards.forEach(card=>card.style.display="block");
    }
}
function setFavButton(button, isFavorite){

    if(isFavorite){
        button.innerHTML = "❤️ Added to Favorite";
        button.classList.add("added");
    }else{
        button.innerHTML = "🤍 Add to Favorite";
        button.classList.remove("added");
    }
}

function toggleFavorite(element){

    let card = element.closest(".college-card");

    let messName =
    card.querySelector("h3").innerText.trim();

    let favorites =
    JSON.parse(localStorage.getItem("favorites")) || [];

    let index =
    favorites.indexOf(messName);

    if(index === -1){

        favorites.push(messName);
        setFavButton(element, true);

    }else{

        favorites.splice(index,1);
        setFavButton(element, false);
    }

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );
}

function findLocation() {

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(function(position) {

            let lat = position.coords.latitude;
            let lng = position.coords.longitude;

            window.open(
                "https://www.google.com/maps/search/mess/@"
                + lat + "," + lng + ",15z",
                "_blank"
            );

        }, showError);

    } else {

        alert("Geolocation not supported");

    }

}


function showPosition(position){

    document.getElementById(
        "locationResult"
    ).innerHTML =
    "✅ Location Detected Successfully";

    window.open(
        "https://www.google.com/maps/search/mess+near+me",
        "_blank"
    );

}

function showError(){

    document.getElementById(
        "locationResult"
    ).innerHTML =
    "Location access denied.";

}
function loadOwnerMesses(){



}
// anonymous id so one visitor = one rating per mess (rating again changes it)
function getVoterId(){
    try{
        let id = localStorage.getItem("voterId");
        if(!id){
            id = (window.crypto && crypto.randomUUID)
                ? crypto.randomUUID()
                : "v-" + Date.now() + "-" + Math.random().toString(36).slice(2, 12);
            localStorage.setItem("voterId", id);
        }
        return id;
    }catch(e){
        return "v-" + Math.random().toString(36).slice(2, 14) + Date.now();
    }
}

function overallText(info){
    if(!info || !info.count) return "⭐ Overall Rating: No ratings yet";
    return "⭐ Overall Rating: " + Number(info.average).toFixed(1) + " / 5 (" + info.count +
        (info.count === 1 ? " rating)" : " ratings)");
}

// Re-apply saved favourites (hearts) and the user's saved ratings after a reload
function restoreSavedState(){

    try{

        let favorites =
        JSON.parse(localStorage.getItem("favorites")) || [];

        document.querySelectorAll(".fav-btn").forEach(el => {

            let title = el.closest(".college-card").querySelector("h3");

            if(title && favorites.includes(title.innerText.trim())){
                setFavButton(el, true);
            }

        });

    }catch(error){
        console.error("Could not restore favorites:", error);
    }

}

function highlightFromHash(){

    let hash = window.location.hash;

    if(!hash) return;

    let card = null;

    try{
        card = document.getElementById(decodeURIComponent(hash.slice(1)));
    }catch(error){
        card = null;
    }

    if(card){

        card.classList.add("highlight");

        card.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }
}

window.addEventListener("load", function(){

    loadDatabaseMesses().finally(function(){
        document.dispatchEvent(new Event("messes-ready"));
    });
    restoreSavedState();
    highlightFromHash();

});
// Escapes text before it is placed in the page
function esc(value){
    return String(value === undefined || value === null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

// Weekly Menu button on cards of messes stored in the database
let dynamicMessData = {};

document.addEventListener("click", function(e){

    let btn = e.target.closest(".dyn-menu-btn");
    if(!btn) return;

    let mess = dynamicMessData[btn.dataset.key] || {};

    showMenuPopup(mess.menu || "", {
        title: (mess.name || "Mess") + " Menu"
    });
});

// Ratings for messes stored in the database are saved on the server
document.addEventListener("click", async function(e){

    let btn = e.target.closest(".dyn-rate-btn");
    if(!btn) return;

    let card = btn.closest(".college-card");
    let rating = card.querySelector(".dyn-rate").value;
    let thanks = card.querySelector(".dyn-thanks");

    if(rating === ""){
        alert("Please select a rating first.");
        return;
    }

    btn.disabled = true;

    try{
        const res = await fetch(
            "/api/messes/" + encodeURIComponent(btn.dataset.key) + "/reviews",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ rating: Number(rating), voterId: getVoterId() })
            }
        );
        const out = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error(out.error || "Could not save rating");
        thanks.innerText = "✅ Thank you for your response!";
        card.querySelector(".dyn-overall").innerText = overallText(out);
        card.querySelector(".dyn-rate").value = "";
    }catch(err){
        thanks.innerText = "❌ " + err.message;
    }

    btn.disabled = false;
});

async function loadDatabaseMesses(){

let container =
document.getElementById("dynamicMesses");

if(!container) return;

try{

const snapshot =
await get(ref(db,"messes"));

if(!snapshot.exists()) return;

const data = snapshot.val();

let html = "";

dynamicMessData = data;

Object.entries(data).filter(([k,v])=>v).forEach(([key,mess])=>{

let reviews = Array.isArray(mess.reviews)
? mess.reviews
: Object.values(mess.reviews || {});

let ratingText = overallText({
  count: reviews.length,
  average: reviews.length ? reviews.reduce((sum,r)=>sum+Number(r.rating||0),0) / reviews.length : 0
});

// Veg = green, Non-Veg = red, both = "Veg & Non-Veg" (same red pill as the built-in cards)
let rawType = String(mess.type || "").toLowerCase();
let hasNonVeg = /non[\s-]*veg/.test(rawType);
let hasVeg = /veg/.test(rawType.replace(/non[\s-]*veg/g, ""));
let isBoth = /both/.test(rawType) || (hasNonVeg && hasVeg);
let badge =
isBoth ? '<span class="nonveg">🔴 Veg & Non-Veg</span>' :
hasNonVeg ? '<span class="nonveg">🔴 Non-Veg</span>' :
hasVeg ? '<span class="veg">🟢 Veg</span>' :
(mess.type ? "<p>🍽 " + esc(mess.type) + "</p>" : "");

// WhatsApp: number (new) or an old wa.me link
let waNumber = String(mess.whatsappNumber || "").replace(/\D/g, "");
if(!waNumber){
    let legacy = String(mess.whatsappLink || "").match(/wa\.me\/(\d+)/i);
    waNumber = legacy ? legacy[1] : "";
}

// so the Veg / Non-Veg filter buttons also work on these cards
let t = (mess.type || "").toLowerCase();
let typeClass =
t.includes("non") || t.includes("both") ? " nonveg-card" :
(t.includes("veg") ? " veg-card" : "");

// price can hold more than one line, separated by " | " (e.g. monthly plan | per meal)
let priceLines = String(mess.price || "").split("|").map(function(p){ return p.trim(); }).filter(Boolean)
.map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");

html += `

<div class="college-card${typeClass}" id="${esc(key)}">

<img src="${esc(
mess.photo ||
'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600'
)}" alt="${esc(mess.name)}">

<h3>${esc(mess.name)}</h3>

<button class="fav-btn" onclick="toggleFavorite(this)">🤍 Add to Favorite</button>

${badge}

<p>📍 ${esc(mess.location)}</p>

${priceLines}

${mess.contactNumber ? `<p>📞 ${esc(mess.contactNumber)}</p>` : ""}

${(mess.openTime || mess.closeTime) ? `<p>🕒 ${esc(mess.openTime || "")} - ${esc(mess.closeTime || "")}</p>` : ""}

<p class="dyn-overall">${esc(ratingText)}</p>

<select class="dyn-rate">
<option value="">Select Rating</option>
<option value="1">⭐ 1</option>
<option value="2">⭐⭐ 2</option>
<option value="3">⭐⭐⭐ 3</option>
<option value="4">⭐⭐⭐⭐ 4</option>
<option value="5">⭐⭐⭐⭐⭐ 5</option>
</select>

<button class="dyn-rate-btn" data-key="${esc(key)}">⭐ Submit Rating</button>

<p class="dyn-thanks"></p>

<button class="dyn-menu-btn" data-key="${esc(key)}">📋 Weekly Menu</button>

<br><br>

${mess.mapLink ? `<a href="${esc(mess.mapLink)}"
class="btn"
target="_blank">
📍 Real Location
</a>` : ""}

${waNumber ? `<a href="https://wa.me/${esc(waNumber)}"
class="btn"
target="_blank">
💬 WhatsApp
</a>` : ""}

</div>

`;

});

container.innerHTML = html;

restoreSavedState();
highlightFromHash();

}catch(error){

console.error("Could not load messes:", error);

}

}

// This script is a module, so functions used by onclick="..." in the HTML
// must be attached to window (they were not, so those buttons did nothing)
Object.assign(window, {
    searchMess, filterMess, toggleFavorite, findLocation,
    showMenuPopup, closeMenuPopup
});
</script>
