<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Portal - PCCOE/DYP Mess Finder</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
}

.login-box{
    width:380px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:20px;
    text-align:center;
    color:white;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.login-box h2{
    margin-bottom:10px;
}

.login-box p{
    margin-bottom:20px;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0ea5e9;
}

.note{
    margin-top:20px;
    font-size:14px;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="login-box">

    <h2>🔐 Login Portal</h2>

    <p>
        Admin & Mess Owner Login
    </p>

    <input
        type="text"
        id="username"
        placeholder="Email or Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <div class="note">
        Admin or Registered Mess Owner
    </div>

</div>

<script>

async function login(){

    let username =
    document.getElementById("username").value.trim();

    let password =
    document.getElementById("password").value.trim();

    if(!username || !password){
        alert("Please enter your username and password.");
        return;
    }

    try{

        const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
        });

        const data = await res.json().catch(() => ({}));

        if(!res.ok){
            alert(data.error || "Invalid Username or Password");
            return;
        }

        localStorage.setItem("authToken", data.token);

        if(data.role === "admin"){
            localStorage.setItem("adminLoggedIn", "true");
            window.location.href = "dashboard.html";
        }else{
            localStorage.setItem("ownerLoggedIn", data.email || username);
            window.location.href = "owner-dashboard.html";
        }

    }catch(error){
        console.error(error);
        alert("Could not connect. Please try again.");
    }
}

</script>

</body>
</html>
